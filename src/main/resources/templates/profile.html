<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile | SecureBank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f6f9;
        }

        .navbar {
            background: linear-gradient(135deg, #203a43, #2c5364);
        }

        .navbar-brand {
            font-weight: 600;
        }

        .profile-card {
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #0f2027, #2c5364);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            background: white;
            color: #2c5364;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            margin: 0 auto 10px;
        }

        .profile-body {
            padding: 30px;
        }

        .profile-item {
            margin-bottom: 18px;
        }

        .profile-item label {
            font-size: 13px;
            color: #777;
        }

        .profile-item p {
            font-size: 15px;
            font-weight: 500;
            margin: 0;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">SecureBank</a>

        <div class="ms-auto">
            <a href="/dashboard" class="btn btn-light btn-sm me-2">Dashboard</a>

            <!-- LOGOUT -->
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- 🔹 PROFILE CONTENT -->
<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card profile-card">

                <!-- HEADER -->
                <div class="profile-header">
                    <div class="profile-avatar">
                        <span th:text="${user.name.substring(0,1)}">U</span>
                    </div>
                    <h4 th:text="${user.name}">User Name</h4>
                    <small th:text="${user.email}">email@example.com</small>
                </div>

                <!-- BODY -->
                <div class="profile-body">

                    <div class="profile-item">
                        <label>Full Name</label>
                        <p th:text="${user.name}"></p>
                    </div>

                    <div class="profile-item">
                        <label>Email Address</label>
                        <p th:text="${user.email}"></p>
                    </div>

                    <div class="profile-item">
                        <label>Mobile Number</label>
                        <p th:text="${user.mobileNumber}">Not Provided</p>
                    </div>

                    <div class="profile-item">
                        <label>Account Number</label>
                        <p th:text="${account.accountNumber}">—</p>
                    </div>

                    <div class="profile-item">
                        <label>Current Balance</label>
                        <p class="text-success fw-bold">
                            ₹ <span th:text="${account.balance}">0</span>
                        </p>
                    </div>

                    <div class="profile-item">
                        <label>Account Status</label>
                        <span th:if="${user.active}" class="badge bg-success">ACTIVE</span>
                        <span th:if="${!user.active}" class="badge bg-danger">BLOCKED</span>
                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

<!-- 🔹 FOOTER -->
<div class="footer">
    © 2026 SecureBank<br>
    Designed & Developed by <b>Rudresh Narayan More</b>
</div>

</body>
</html>
