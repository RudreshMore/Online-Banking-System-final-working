<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transactions | SecureBank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }
        .card { border-radius: 14px; }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>📄 Transaction History</h4>
        <a href="/admin/dashboard" class="btn btn-secondary btn-sm">⬅ Back</a>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Amount (₹)</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="tx, stat : ${transactions}">
                    <td th:text="${stat.count}"></td>

                    <!-- TYPE -->
                    <td>
                        <span class="badge"
                              th:classappend="
                                ${tx.type == 'ADMIN_CREDIT'} ? 'bg-primary' :
                                (${tx.type == 'CREDIT'} ? 'bg-success' :
                                (${tx.type == 'DEBIT'} ? 'bg-danger' : 'bg-secondary'))"
                              th:text="${tx.type}">
                        </span>
                    </td>

                    <!-- DESCRIPTION -->
                    <td>
                        <span th:if="${tx.type == 'ADMIN_CREDIT'}">
                            Admin Deposit
                        </span>
                        <span th:if="${tx.type == 'DEBIT'}">
                            Money Sent
                        </span>
                        <span th:if="${tx.type == 'CREDIT'}">
                            Money Received
                        </span>
                    </td>

                    <td th:text="${tx.fromAccount ?: 'ADMIN'}"></td>
                    <td th:text="${tx.toAccount}"></td>
                    <td th:text="${tx.amount}"></td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>
</div>

</body>
</html>
