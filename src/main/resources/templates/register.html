<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SecureBank | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #ffffff;
            width: 400px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.9s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bank-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .bank-logo h1 {
            color: #2c5364;
            font-weight: 600;
        }

        .bank-logo span {
            color: #0f2027;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #2c5364;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #203a43, #2c5364);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .success-msg {
            color: #27ae60;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            color: #2c5364;
            font-size: 13px;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="login-container">

    <div class="bank-logo">
        <h1>SecureBank</h1>
        <span>Safe • Simple • Smart Banking</span>
    </div>

    <!-- ERROR MESSAGE -->
    <div th:if="${error}" class="error-msg">
        <span th:text="${error}"></span>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${success}" class="success-msg">
        <span th:text="${success}"></span>
    </div>

    <form th:action="@{/register}" method="post">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text"
                   name="name"
                   placeholder="Enter your full name"
                   required>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="text"
                   name="mobileNumber"
                   placeholder="Enter mobile number"
                   pattern="[0-9]{10}"
                   required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>
        </div>

        <button type="submit" class="login-btn">
            Create Account
        </button>
    </form>

    <div class="links">
        <a th:href="@{/login}">Already have an account? Login</a>
    </div>

    <div class="links" style="margin-top: 8px;">
    <a th:href="@{/}">⬅ Back to Home</a>
</div>
    

</div>

</body>
</html>
