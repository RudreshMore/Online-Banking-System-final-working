<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>SecureBank | Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
	rel="stylesheet">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: 'Poppins', sans-serif;
}

body {
	background: #f4f7fb;
	min-height: 100vh;
}

/* NAVBAR */
.navbar {
	background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
	padding: 18px 30px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	color: #fff;
}

.navbar h2 {
	font-weight: 600;
}

.navbar a, .navbar button {
	color: white;
	background: none;
	border: none;
	text-decoration: none;
	font-size: 14px;
	margin-left: 18px;
	cursor: pointer;
}

.navbar a:hover, .navbar button:hover {
	text-decoration: underline;
}

/* CONTAINER */
.container {
	padding: 35px;
	max-width: 1300px;
	margin: auto;
}

h3 {
	color: #2c5364;
	margin-bottom: 20px;
}

/* ALERTS */
.alert {
	padding: 12px;
	border-radius: 8px;
	margin-bottom: 20px;
	text-align: center;
	font-size: 14px;
}

.success {
	background: #e8f8f1;
	color: #27ae60;
}

.error {
	background: #fdecea;
	color: #e74c3c;
}

/* TABLE */
table {
	width: 100%;
	border-collapse: collapse;
	background: #fff;
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
	border-radius: 12px;
	overflow: hidden;
}

th, td {
	padding: 14px;
	text-align: center;
	font-size: 14px;
}

th {
	background: #203a43;
	color: white;
	font-weight: 500;
}

tr:nth-child(even) {
	background: #f9fbfd;
}

/* BUTTONS */
.btn {
	padding: 6px 10px;
	border-radius: 6px;
	border: none;
	cursor: pointer;
	font-size: 12px;
}

.btn-toggle {
	background: linear-gradient(135deg, #e67e22, #f39c12);
	color: white;
}

.btn-view {
	background: linear-gradient(135deg, #2980b9, #3498db);
	color: white;
}

.btn-deposit {
	background: linear-gradient(135deg, #27ae60, #2ecc71);
	color: white;
}

input[type="number"] {
	width: 90px;
	padding: 5px;
	border-radius: 6px;
	border: 1px solid #ccc;
}

/* FOOTER */
.footer {
	margin-top: 40px;
	text-align: center;
	font-size: 12px;
	color: #777;
}

.status-active {
	color: #27ae60;
	font-weight: 600;
}

.status-blocked {
	color: #e74c3c;
	font-weight: 600;
}

.action-link {
    text-decoration: none;
    color: white;
}

.action-link:hover {
    text-decoration: none;
    opacity: 0.9;
}


</style>
</head>
<body>

	<!-- NAVBAR -->
	<div class="navbar">
		<h2>SecureBank • Admin</h2>
		<div>
			<a th:href="@{/admin/dashboard}">Dashboard</a>

			<!-- LOGOUT -->
			<form th:action="@{/logout}" method="post" style="display: inline;">
				<input type="hidden" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}">
				<button type="submit">Logout</button>
			</form>
		</div>
	</div>

	<!-- MAIN -->
	<div class="container">

		<h3>All Users Overview</h3>

		<!-- SUCCESS -->
		<div th:if="${success}" class="alert success" th:text="${success}"></div>

		<!-- ERROR -->
		<div th:if="${error}" class="alert error" th:text="${error}"></div>

		<!-- USERS TABLE -->

		<div
			style="background: white; padding: 18px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
			<h4 style="color: #2c5364;">Total Registered Users</h4>
			<h2 style="color: #203a43;" th:text="${users.size()}">0</h2>
		</div>


		<table>
			<thead>
				<tr>
					<th>Name</th>
					<th>Email</th>
					<th>Account No</th>
					<th>Balance</th>
					<th>Status</th>
					<th>Deposit</th>
					<th>Actions</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="user : ${users}">
					<td th:text="${user.name}">Name</td>
					<td th:text="${user.email}">Email</td>

					<td
						th:text="${user.account != null ? user.account.accountNumber : 'N/A'}"></td>
					<td>₹ <span
						th:text="${user.account != null ? user.account.balance : 0}"></span></td>

					<td><span
						th:class="${user.active} ? 'status-active' : 'status-blocked'"
						th:text="${user.active ? 'Active' : 'Blocked'}"> </span></td>


					<!-- DEPOSIT -->
					<td>
						<form th:action="@{/admin/deposit}" method="post">
							<input type="hidden" name="userId" th:value="${user.id}">
							<input type="number" name="amount" placeholder="₹" required>
							<button class="btn btn-deposit">Deposit</button>
						</form>
					</td>

					<!-- 2️⃣ TRANSACTIONS -->
  <td>  <a th:href="@{/admin/transactions/{id}(id=${user.id})}"
       class="btn btn-view btn-sm action-link">
         Transactions
    </a> <span>   </span>

    <!-- 3️⃣ BLOCK / UNBLOCK -->
    <span><a th:href="@{/admin/toggle/{id}(id=${user.id})}"
       class="btn btn-toggle btn-sm action-link">
         <span th:text="${user.active ? 'Block' : 'Unblock'}"></span>
    </a></span></td>
				</tr>
			</tbody>
		</table>

		<!-- FOOTER -->
		<div class="footer">
			© 2026 SecureBank <br> Designed & Developed by <b>Rudresh
				Narayan More</b>
		</div>

	</div>

</body>
</html>
